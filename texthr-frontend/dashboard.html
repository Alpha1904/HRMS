<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard - Departures</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-50">
    <div class="min-h-screen flex">
      <aside id="sidebar" class="w-72 bg-white border-r border-slate-200 hidden md:flex flex-col">
        <div class="p-5 border-b border-slate-200">
          <div class="text-sm font-semibold text-slate-900">HRMS</div>
          <div class="text-xs text-slate-600">Managing Departures</div>
        </div>
        <nav class="p-3 space-y-1" id="nav"></nav>
        <div class="mt-auto p-4 border-t border-slate-200">
          <div class="text-xs text-slate-600" id="currentUser"></div>
          <button id="logoutBtn" class="mt-3 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm hover:bg-slate-50">Logout</button>
        </div>
      </aside>

      <div class="flex-1 flex flex-col">
        <header class="bg-white border-b border-slate-200">
          <div class="px-4 py-3 flex items-center justify-between">
            <button id="mobileMenuBtn" class="md:hidden inline-flex items-center justify-center rounded-lg border border-slate-300 px-3 py-2 text-sm">Menu</button>
            <div class="text-sm text-slate-600" id="pageTitle">Dashboard</div>
            <div class="flex items-center gap-2">
              <button id="refreshBtn" class="inline-flex items-center justify-center rounded-lg border border-slate-300 px-3 py-2 text-sm hover:bg-slate-50">Refresh</button>
            </div>
          </div>
        </header>

        <main class="p-4 md:p-6">
          <section id="overviewSection" class="hidden"></section>
          <section id="departuresSection" class="hidden"></section>
          <section id="departureDetailSection" class="hidden"></section>
          <section id="tasksSection" class="hidden"></section>
          <section id="surveysSection" class="hidden"></section>
        </main>
      </div>
    </div>

    <div id="mobileSidebar" class="fixed inset-0 bg-black/30 hidden z-40">
      <div class="absolute left-0 top-0 h-full w-72 bg-white border-r border-slate-200 flex flex-col">
        <div class="p-5 border-b border-slate-200 flex items-center justify-between">
          <div>
            <div class="text-sm font-semibold text-slate-900">HRMS</div>
            <div class="text-xs text-slate-600">Managing Departures</div>
          </div>
          <button id="mobileCloseBtn" class="rounded-lg border border-slate-300 px-3 py-2 text-sm">Close</button>
        </div>
        <nav class="p-3 space-y-1" id="mobileNav"></nav>
        <div class="mt-auto p-4 border-t border-slate-200">
          <div class="text-xs text-slate-600" id="mobileCurrentUser"></div>
          <button id="mobileLogoutBtn" class="mt-3 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm hover:bg-slate-50">Logout</button>
        </div>
      </div>
    </div>

    <div id="toastRoot" class="fixed bottom-4 right-4 space-y-2 z-50"></div>

    <script type="module" src="./assets/js/app.js"></script>
  </body>
</html>
