<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Performance Criteria</title>
    <link rel="stylesheet" href="../dist/style.css" />
  </head>
  <body class="antialiased bg-light text-default">
    <script type="module">
      import { enforceAuthenticatedRoute } from '../dist/assets/js/auth-login.js';
      enforceAuthenticatedRoute();
    </script>

    <div class="max-w-6xl mx-auto p-4 space-y-4">
      <div id="perf-nav"></div>

      <div class="bg-white border border-borderColor rounded p-4 flex items-center justify-between gap-4">
        <div>
          <h1 class="text-lg font-semibold">Evaluation Criteria</h1>
          <p class="text-sm text-gray-600">Configure criteria and weights (active weights should sum to 1.0).</p>
          <div class="text-sm text-gray-700 mt-2">Active weight total: <span id="criteria-total" class="font-semibold">0.00</span></div>
        </div>
        <button id="crit-create" type="button" class="px-3 py-2 rounded text-sm font-medium bg-primary text-white">Add Criteria</button>
      </div>

      <div class="bg-white border border-borderColor rounded overflow-hidden">
        <table class="w-full">
          <thead class="bg-gray-50">
            <tr>
              <th class="text-left text-xs font-semibold text-gray-600 px-4 py-2">Name</th>
              <th class="text-left text-xs font-semibold text-gray-600 px-4 py-2">Description</th>
              <th class="text-left text-xs font-semibold text-gray-600 px-4 py-2">Weight</th>
              <th class="text-left text-xs font-semibold text-gray-600 px-4 py-2">Status</th>
              <th class="text-left text-xs font-semibold text-gray-600 px-4 py-2">Actions</th>
            </tr>
          </thead>
          <tbody id="criteria-tbody"></tbody>
        </table>
        <div id="criteria-empty" class="hidden p-4 text-sm text-gray-600">No criteria found.</div>
      </div>
    </div>

    <div id="criteria-modal" class="hidden fixed inset-0 bg-black/30 z-[9999] flex items-center justify-center p-4">
      <div class="w-full max-w-lg bg-white rounded border border-borderColor shadow">
        <div class="flex items-center justify-between p-4 border-b border-borderColor">
          <div class="font-semibold">Criteria</div>
          <button id="crit-modal-close" type="button" class="px-2 py-1 border rounded bg-white hover:bg-dark-transparent">X</button>
        </div>
        <div class="p-4 space-y-3">
          <input id="crit-id" class="hidden" />

          <div>
            <label class="block text-sm font-medium">Name</label>
            <input id="crit-name" class="w-full border border-borderColor rounded px-3 py-2" placeholder="attendance" />
          </div>

          <div>
            <label class="block text-sm font-medium">Description (optional)</label>
            <input id="crit-desc" class="w-full border border-borderColor rounded px-3 py-2" placeholder="Measures attendance based on approved leave" />
          </div>

          <div id="crit-weight-wrap">
            <label class="block text-sm font-medium">Weight (0..1)</label>
            <input id="crit-weight" type="number" min="0" max="1" step="0.01" class="w-full border border-borderColor rounded px-3 py-2" placeholder="0.30" />
          </div>

          <div>
            <label class="block text-sm font-medium">Tenant ID (optional)</label>
            <input id="crit-tenant" class="w-full border border-borderColor rounded px-3 py-2" placeholder="tenant_123" />
          </div>

          <div class="flex items-center justify-end gap-2 pt-2">
            <button id="crit-modal-cancel" type="button" class="px-3 py-2 rounded text-sm border border-borderColor bg-white hover:bg-dark-transparent">Cancel</button>
            <button id="crit-save" type="button" class="px-3 py-2 rounded text-sm font-medium bg-primary text-white">Save</button>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="../dist/assets/js/performance/criteria.js?v=20260312-1"></script>
  </body>
</html>
