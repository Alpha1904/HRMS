<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payslips</title>
    <link rel="stylesheet" href="../dist/style.css" />
  </head>
  <body class="antialiased bg-light text-default">
    <script type="module">
      import { enforceAuthenticatedRoute } from '../dist/assets/js/auth-login.js';
      enforceAuthenticatedRoute();
    </script>

    <div class="max-w-7xl mx-auto p-4 space-y-4">
      <div id="payment-nav"></div>

      <div class="bg-white border border-borderColor rounded p-4">
        <div class="flex items-start justify-between gap-4 flex-col sm:flex-row">
          <div>
            <h1 class="text-lg font-semibold">Payslips</h1>
            <p class="text-sm text-gray-600">View, generate, and download monthly payslips.</p>
          </div>
        </div>

        <div class="mt-4 grid grid-cols-1 md:grid-cols-12 gap-3">
          <div id="admin-profile-wrap" class="md:col-span-4">
            <label class="block text-xs font-medium text-gray-600">Employee Profile ID</label>
            <input id="profileId" class="w-full border border-borderColor rounded px-3 py-2" placeholder="10" inputmode="numeric" />
          </div>

          <div class="md:col-span-4">
            <label class="block text-xs font-medium text-gray-600">Month</label>
            <input id="month" type="month" class="w-full border border-borderColor rounded px-3 py-2" />
          </div>

          <div class="md:col-span-4 flex items-end gap-2">
            <button id="btn-load" type="button" class="px-3 py-2 rounded text-sm font-medium border border-borderColor bg-white hover:bg-dark-transparent">Load</button>
            <button id="btn-load-last" type="button" class="px-3 py-2 rounded text-sm font-medium border border-borderColor bg-white hover:bg-dark-transparent">Load last 12 months</button>
            <button id="btn-generate" type="button" class="px-3 py-2 rounded text-sm font-medium bg-primary text-white">Generate</button>
          </div>
        </div>
      </div>

      <div class="bg-white border border-borderColor rounded overflow-hidden">
        <div class="p-3 flex items-center justify-between">
          <div class="text-sm text-gray-700">Payslips</div>
          <div class="text-sm text-gray-500" id="payslips-hint"></div>
        </div>

        <table class="w-full">
          <thead class="bg-gray-50">
            <tr>
              <th class="text-left text-xs font-semibold text-gray-600 px-4 py-2">Month</th>
              <th class="text-left text-xs font-semibold text-gray-600 px-4 py-2">Gross</th>
              <th class="text-left text-xs font-semibold text-gray-600 px-4 py-2">Deductions</th>
              <th class="text-left text-xs font-semibold text-gray-600 px-4 py-2">Net</th>
              <th class="text-left text-xs font-semibold text-gray-600 px-4 py-2">Status</th>
              <th class="text-left text-xs font-semibold text-gray-600 px-4 py-2">Actions</th>
            </tr>
          </thead>
          <tbody id="payslips-tbody"></tbody>
        </table>

        <div id="payslips-empty" class="hidden p-4 text-sm text-gray-600">No payslips found for the selected period.</div>
      </div>
    </div>

    <script type="module" src="../dist/assets/js/payment/payslips.js"></script>
  </body>
</html>
