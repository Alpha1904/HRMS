<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Performance Rankings</title>
    <link rel="stylesheet" href="../dist/style.css" />
  </head>
  <body class="antialiased bg-light text-default">
    <script type="module">
      import { enforceAuthenticatedRoute } from '../dist/assets/js/auth-login.js';
      enforceAuthenticatedRoute();
    </script>

    <div class="max-w-6xl mx-auto p-4 space-y-4">
      <div id="perf-nav"></div>

      <div class="bg-white border border-borderColor rounded p-4">
        <div class="flex items-start justify-between gap-4 flex-col sm:flex-row">
          <div>
            <h1 class="text-lg font-semibold">Rankings</h1>
            <p class="text-sm text-gray-600">View rankings for a cycle. Admins can calculate rankings.</p>
          </div>
          <button id="rankings-calc" type="button" class="px-3 py-2 rounded text-sm font-medium bg-primary text-white">Calculate Rankings</button>
        </div>

        <div class="mt-4 grid grid-cols-1 md:grid-cols-4 gap-3">
          <div>
            <label class="block text-xs font-medium text-gray-600">Cycle</label>
            <select id="rankings-cycleId" class="w-full border border-borderColor rounded px-3 py-2">
              <option value="" disabled selected>Select a cycle</option>
              <option value="" disabled>Loading cycles...</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-600">Department (optional)</label>
            <input id="rankings-dept" class="w-full border border-borderColor rounded px-3 py-2" placeholder="Engineering" />
          </div>
          <div class="md:col-span-2 flex items-end gap-2">
            <button id="rankings-apply" type="button" class="px-3 py-2 rounded text-sm font-medium bg-primary text-white">Apply</button>
          </div>
        </div>
      </div>

      <div class="bg-white border border-borderColor rounded overflow-hidden">
        <table class="w-full">
          <thead class="bg-gray-50">
            <tr>
              <th class="text-left text-xs font-semibold text-gray-600 px-4 py-2">Rank</th>
              <th class="text-left text-xs font-semibold text-gray-600 px-4 py-2">Employee</th>
              <th class="text-left text-xs font-semibold text-gray-600 px-4 py-2">Department</th>
              <th class="text-left text-xs font-semibold text-gray-600 px-4 py-2">Final Score</th>
            </tr>
          </thead>
          <tbody id="rankings-tbody"></tbody>
        </table>
        <div id="rankings-empty" class="hidden p-4 text-sm text-gray-600">Select a cycle to view rankings.</div>
      </div>
    </div>

    <script type="module" src="../dist/assets/js/performance/rankings.js"></script>
  </body>
</html>
