<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Salary Adjustments</title>
    <link rel="stylesheet" href="../dist/style.css" />
  </head>
  <body class="antialiased bg-light text-default">
    <script type="module">
      import { enforceAuthenticatedRoute } from '../dist/assets/js/auth-login.js';
      enforceAuthenticatedRoute('login.html', ['HR_ADMIN', 'SYSTEM_ADMIN']);
    </script>

    <div class="max-w-7xl mx-auto p-4 space-y-4">
      <div id="payment-nav"></div>

      <div class="bg-white border border-borderColor rounded p-4">
        <div class="flex items-start justify-between gap-4 flex-col sm:flex-row">
          <div>
            <h1 class="text-lg font-semibold">Salary Adjustments</h1>
            <p class="text-sm text-gray-600">Apply salary changes and view adjustment history.</p>
          </div>

          <div class="flex items-center gap-2">
            <button id="btn-open-create" type="button" class="px-3 py-2 rounded text-sm font-medium bg-primary text-white">Add adjustment</button>
          </div>
        </div>

        <div class="mt-4 grid grid-cols-1 md:grid-cols-12 gap-3">
          <div class="md:col-span-5">
            <label class="block text-xs font-medium text-gray-600">Find employee</label>
            <div class="flex gap-2">
              <input id="profileSearch" class="w-full border border-borderColor rounded px-3 py-2" placeholder="Search by name or email" />
              <button id="btn-profile-search" type="button" class="px-3 py-2 rounded text-sm font-medium border border-borderColor bg-white hover:bg-dark-transparent">Search</button>
            </div>
            <select id="profileSelect" class="mt-2 w-full border border-borderColor rounded px-3 py-2">
              <option value="">Select a profile</option>
            </select>
          </div>

          <div class="md:col-span-3 hidden">
            <label class="block text-xs font-medium text-gray-600">Profile ID</label>
            <input id="profileId" class="w-full border border-borderColor rounded px-3 py-2" placeholder="10" inputmode="numeric" />
          </div>

          <div class="md:col-span-4 flex items-end gap-2">
            <button id="btn-load" type="button" class="px-3 py-2 rounded text-sm font-medium border border-borderColor bg-white hover:bg-dark-transparent">Load adjustments</button>
          </div>
        </div>
      </div>

      <div class="bg-white border border-borderColor rounded overflow-hidden">
        <div class="p-3 text-sm text-gray-700">History</div>

        <table class="w-full">
          <thead class="bg-gray-50">
            <tr>
              <th class="text-left text-xs font-semibold text-gray-600 px-4 py-2">ID</th>
              <th class="text-left text-xs font-semibold text-gray-600 px-4 py-2">Type</th>
              <th class="text-left text-xs font-semibold text-gray-600 px-4 py-2">Amount</th>
              <th class="text-left text-xs font-semibold text-gray-600 px-4 py-2">Percentage</th>
              <th class="text-left text-xs font-semibold text-gray-600 px-4 py-2">Reason</th>
              <th class="text-left text-xs font-semibold text-gray-600 px-4 py-2">Effective date</th>
              <th class="text-left text-xs font-semibold text-gray-600 px-4 py-2">Actions</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>

        <div id="empty" class="hidden p-4 text-sm text-gray-600">No adjustments found for this profile.</div>
      </div>
    </div>

    <div id="modal" class="hidden fixed inset-0 bg-black/40 z-50 items-center justify-center p-4" role="dialog" aria-modal="true">
      <div class="w-full max-w-2xl bg-white rounded-lg shadow-lg border border-borderColor">
        <div class="p-4 border-b border-borderColor flex items-center justify-between">
          <div class="font-semibold" id="modal-title">Add adjustment</div>
          <button id="btn-close" class="px-2 py-1 rounded text-sm border border-borderColor bg-white hover:bg-dark-transparent" type="button">Close</button>
        </div>

        <form id="form" class="p-4 grid grid-cols-1 md:grid-cols-2 gap-3">
          <input id="f-id" type="hidden" />
          <div>
            <label class="block text-xs font-medium text-gray-600">Profile ID</label>
            <input id="f-profileId" class="w-full border border-borderColor rounded px-3 py-2" inputmode="numeric" required />
          </div>

          <div>
            <label class="block text-xs font-medium text-gray-600">Component</label>
            <select id="f-componentId" class="w-full border border-borderColor rounded px-3 py-2">
              <option value="">None</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-medium text-gray-600">Adjustment type</label>
            <input id="f-type" class="w-full border border-borderColor rounded px-3 py-2" placeholder="INCREASE" required />
          </div>

          <div>
            <label class="block text-xs font-medium text-gray-600">Amount</label>
            <input id="f-amount" type="number" step="0.01" class="w-full border border-borderColor rounded px-3 py-2" required />
          </div>

          <div>
            <label class="block text-xs font-medium text-gray-600">Percentage</label>
            <input id="f-percentage" type="number" step="0.01" class="w-full border border-borderColor rounded px-3 py-2" placeholder="Optional" />
          </div>

          <div>
            <label class="block text-xs font-medium text-gray-600">Effective date</label>
            <input id="f-date" type="date" class="w-full border border-borderColor rounded px-3 py-2" required />
          </div>

          <div class="md:col-span-2">
            <label class="block text-xs font-medium text-gray-600">Reason</label>
            <input id="f-reason" class="w-full border border-borderColor rounded px-3 py-2" required />
          </div>

          <div class="md:col-span-2 flex items-center justify-end gap-2">
            <button id="btn-submit" type="submit" class="px-3 py-2 rounded text-sm font-medium bg-primary text-white">Create</button>
          </div>
        </form>
      </div>
    </div>

    <script type="module" src="../dist/assets/js/payment/adjustments.js"></script>
  </body>
</html>
