<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Performance Evaluations</title>
    <link rel="stylesheet" href="../dist/style.css" />
  </head>
  <body class="antialiased bg-light text-default">
    <script type="module">
      import { enforceAuthenticatedRoute } from '../dist/assets/js/auth-login.js';
      enforceAuthenticatedRoute();
    </script>

    <div class="max-w-7xl mx-auto p-4 space-y-4">
      <div id="perf-nav"></div>

      <div class="bg-white border border-borderColor rounded p-4">
        <div class="flex items-start justify-between gap-4 flex-col sm:flex-row">
          <div>
            <h1 class="text-lg font-semibold">Evaluations</h1>
            <p class="text-sm text-gray-600">Filter and review performance evaluations. Auto-refresh every 15s.</p>
          </div>
          <button id="init-evals" type="button" class="px-3 py-2 rounded text-sm font-medium bg-primary text-white">Initialize Evaluations For Cycle</button>
        </div>

        <div class="mt-4 grid grid-cols-4 md:grid-cols-6 gap-3">
          <div>
            <label class="block text-xs font-medium text-gray-600">Cycle</label>
            <select id="filter-cycleId" class="w-full border border-borderColor rounded px-3 py-2">
              <option value="">All cycles</option>
              <option value="" disabled>Loading cycles...</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-600">Status</label>
            <select id="filter-status" class="w-full border border-borderColor rounded px-3 py-2">
              <option value="">Any</option>
              <option value="DRAFT">DRAFT</option>
              <option value="IN_PROGRESS">IN_PROGRESS</option>
              <option value="COMPLETED">COMPLETED</option>
              <option value="ARCHIVED">ARCHIVED</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-600">Department</label>
            <input id="filter-department" class="w-full border border-borderColor rounded px-3 py-2" placeholder="Engineering" />
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-600">Employee Full Name</label>
            <select id="filter-employeeId" class="w-full border border-borderColor rounded px-3 py-2">
              <option value="">All employees</option>
              <option value="" disabled>Loading employees...</option>
            </select>
          </div>
        </div>

        <div class="mt-3 flex flex-wrap gap-2">
          <button id="filter-apply" type="button" class="px-3 py-2 rounded text-sm font-medium bg-primary text-white">Apply</button>
          <button id="filter-reset" type="button" class="px-3 py-2 rounded text-sm font-medium border border-borderColor bg-white hover:bg-dark-transparent">Reset</button>
        </div>
      </div>

      <div class="bg-white border border-borderColor rounded overflow-hidden">
        <div class="p-3 flex items-center justify-between">
          <div class="text-sm text-gray-700">Total: <span id="evals-total">0</span></div>
          <div class="flex items-center gap-2">
            <button id="page-prev" class="px-3 py-2 rounded text-sm font-medium border border-borderColor bg-white hover:bg-dark-transparent">Prev</button>
            <span class="text-sm text-gray-600" id="evals-page">1 / 1</span>
            <button id="page-next" class="px-3 py-2 rounded text-sm font-medium border border-borderColor bg-white hover:bg-dark-transparent">Next</button>
          </div>
        </div>

        <table class="w-full">
          <thead class="bg-gray-50">
            <tr>
              <th class="text-left text-xs font-semibold text-gray-600 px-4 py-2">ID</th>
              <th class="text-left text-xs font-semibold text-gray-600 px-4 py-2">Employee</th>
              <th class="text-left text-xs font-semibold text-gray-600 px-4 py-2">Department</th>
              <th class="text-left text-xs font-semibold text-gray-600 px-4 py-2">Cycle</th>
              <th class="text-left text-xs font-semibold text-gray-600 px-4 py-2">Status</th>
              <th class="text-left text-xs font-semibold text-gray-600 px-4 py-2">Final Score</th>
              <th class="text-left text-xs font-semibold text-gray-600 px-4 py-2">Rank</th>
              <th class="text-left text-xs font-semibold text-gray-600 px-4 py-2">Actions</th>
            </tr>
          </thead>
          <tbody id="evals-tbody"></tbody>
        </table>
        <div id="evals-empty" class="hidden p-4 text-sm text-gray-600">No evaluations found for the current filters.</div>
      </div>
    </div>

    <script type="module" src="../dist/assets/js/performance/evaluations.js"></script>
  </body>
</html>
