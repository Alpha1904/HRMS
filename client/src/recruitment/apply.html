<!doctype html>
<html lang="en" class="h-full">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HRMS • Apply</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="./styles.css" />
</head>

<body class="h-full bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100" data-page="apply">
  <div id="global-loading" class="hidden fixed inset-0 z-[90] bg-black/20 dark:bg-black/40">
    <div class="absolute inset-0 flex items-center justify-center">
      <div class="rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-lg px-5 py-4 flex items-center gap-3">
        <div class="h-5 w-5 animate-spin rounded-full border-2 border-slate-300 border-t-blue-600"></div>
        <div id="global-loading-text" class="text-sm text-slate-700 dark:text-slate-200">Loading…</div>
      </div>
    </div>
  </div>

  <div class="min-h-full flex">
    <aside class="hidden md:flex md:w-64 md:flex-col border-r border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900">
      <div class="px-4 py-4 border-b border-slate-200 dark:border-slate-800">
        <div class="text-sm font-semibold">Recruitment</div>
        <div class="text-xs text-slate-500 dark:text-slate-400">Public application form</div>
      </div>

      <nav class="p-3 flex flex-col gap-1">
        <a data-nav="jobs" href="./index.html" class="px-3 py-2 rounded-lg text-sm text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800">Jobs & Kanban</a>
        <a data-nav="candidates" href="./candidates.html" class="px-3 py-2 rounded-lg text-sm text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800">Candidates</a>
        <a data-nav="documents" href="./documents.html" class="px-3 py-2 rounded-lg text-sm text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800">Documents</a>
        <a data-nav="careers" href="./career.html" class="px-3 py-2 rounded-lg text-sm text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800">Careers (Public)</a>
        <a data-nav="apply" href="./apply.html" class="px-3 py-2 rounded-lg text-sm text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800">Public Apply Form</a>
      </nav>

      <div class="mt-auto p-3 border-t border-slate-200 dark:border-slate-800">
        <div class="text-xs text-slate-500 dark:text-slate-400">This page does not require a token.</div>
      </div>
    </aside>

    <main class="flex-1 min-w-0">
      <header class="sticky top-0 z-10 bg-white/90 dark:bg-slate-950/80 backdrop-blur border-b border-slate-200 dark:border-slate-800">
        <div class="px-4 py-3 flex items-center justify-between">
          <div>
            <div class="text-base font-semibold">Apply to a job</div>
            <div class="text-xs text-slate-500 dark:text-slate-400">POST /applications (multipart/form-data)</div>
          </div>
          <div class="flex items-center gap-2">
            <a href="./career.html" class="px-3 py-2 rounded bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-sm">Back to careers</a>
            <a href="./index.html" class="px-3 py-2 rounded bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-sm">Back to dashboard</a>
          </div>
        </div>
      </header>

      <div class="p-4">
        <section class="max-w-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl">
          <form id="apply-form" class="p-4 grid grid-cols-1 gap-3">
            <div>
              <label class="block text-xs text-slate-600 dark:text-slate-300">Posting ID *</label>
              <input id="apply-posting-id" type="number" min="1" class="w-full px-3 py-2 rounded border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-950 text-sm" required />
            </div>

            <div>
              <label class="block text-xs text-slate-600 dark:text-slate-300">Full name *</label>
              <input id="apply-full-name" class="w-full px-3 py-2 rounded border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-950 text-sm" required />
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
              <div>
                <label class="block text-xs text-slate-600 dark:text-slate-300">Email *</label>
                <input id="apply-email" type="email" class="w-full px-3 py-2 rounded border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-950 text-sm" required />
              </div>
              <div>
                <label class="block text-xs text-slate-600 dark:text-slate-300">Phone</label>
                <input id="apply-phone" class="w-full px-3 py-2 rounded border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-950 text-sm" />
              </div>
            </div>

            <div>
              <label class="block text-xs text-slate-600 dark:text-slate-300">LinkedIn URL</label>
              <input id="apply-linkedin" class="w-full px-3 py-2 rounded border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-950 text-sm" placeholder="https://…" />
            </div>

            <div>
              <label class="block text-xs text-slate-600 dark:text-slate-300">Resume</label>
              <input id="apply-resume" type="file" class="w-full text-sm" />
              <div class="text-xs text-slate-500 dark:text-slate-400 mt-1">Field name must be <code class="text-xs">resume</code>.</div>
            </div>

            <div class="flex justify-end pt-2">
              <button type="submit" class="px-3 py-2 rounded bg-blue-600 hover:bg-blue-700 text-white text-sm">Submit application</button>
            </div>
          </form>
        </section>
      </div>
    </main>
  </div>

  <script src="./scripts/core.js"></script>
  <script src="./scripts/ui.js"></script>
  <script src="./scripts/api.js"></script>
  <script src="./scripts/apply.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      window.HRMSRecruitment.apply.init();
    });
  </script>
</body>

</html>
