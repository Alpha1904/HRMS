<!doctype html>
<html lang="en" class="h-full">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HRMS • Candidates</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="./styles.css" />
</head>

<body class="h-full bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100" data-page="candidates">
  <div id="global-loading" class="hidden fixed inset-0 z-[90] bg-black/20 dark:bg-black/40">
    <div class="absolute inset-0 flex items-center justify-center">
      <div class="rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-lg px-5 py-4 flex items-center gap-3">
        <div class="h-5 w-5 animate-spin rounded-full border-2 border-slate-300 border-t-blue-600"></div>
        <div id="global-loading-text" class="text-sm text-slate-700 dark:text-slate-200">Loading…</div>
      </div>
    </div>
  </div>

  <div class="min-h-full flex">
    <aside class="hidden md:flex md:w-64 md:flex-col border-r border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900">
      <div class="px-4 py-4 border-b border-slate-200 dark:border-slate-800">
        <div class="text-sm font-semibold">Recruitment</div>
        <div class="text-xs text-slate-500 dark:text-slate-400">Recruiter dashboard</div>
      </div>

      <nav class="p-3 flex flex-col gap-1">
        <a data-nav="jobs" href="./index.html" class="px-3 py-2 rounded-lg text-sm text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800">Jobs & Kanban</a>
        <a data-nav="candidates" href="./candidates.html" class="px-3 py-2 rounded-lg text-sm text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800">Candidates</a>
        <a data-nav="documents" href="./documents.html" class="px-3 py-2 rounded-lg text-sm text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800">Documents</a>
        <a data-nav="apply" href="./apply.html" class="px-3 py-2 rounded-lg text-sm text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800">Public Apply Form</a>
      </nav>

      <div class="mt-auto p-3 border-t border-slate-200 dark:border-slate-800">
        <button id="logout-btn" class="w-full px-3 py-2 rounded-lg bg-slate-900 hover:bg-slate-800 text-white text-sm">Logout</button>
      </div>
    </aside>

    <main class="flex-1 min-w-0">
      <header class="sticky top-0 z-10 bg-white/90 dark:bg-slate-950/80 backdrop-blur border-b border-slate-200 dark:border-slate-800">
        <div class="px-4 py-3 flex flex-col gap-3 lg:flex-row lg:items-center lg:justify-between">
          <div class="flex items-center gap-3">
            <div class="md:hidden text-sm font-semibold">Candidates</div>
            <div id="me-badge" class="text-xs px-2 py-1 rounded bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-200">Checking…</div>
          </div>

          <div class="flex flex-col sm:flex-row gap-2 sm:items-center">
            <input id="token-input" class="w-full sm:w-[420px] px-3 py-2 rounded border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-950 text-sm" placeholder="Paste JWT token here" />
            <div class="flex gap-2">
              <button id="token-save-btn" class="px-3 py-2 rounded bg-blue-600 hover:bg-blue-700 text-white text-sm">Save</button>
              <button id="token-check-btn" class="px-3 py-2 rounded bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-900 dark:text-slate-100 text-sm">Check</button>
              <button id="token-clear-btn" class="px-3 py-2 rounded bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-900 dark:text-slate-100 text-sm">Clear</button>
            </div>
          </div>
        </div>
      </header>

      <div class="p-4 space-y-6">
        <section class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl">
          <div class="px-4 py-4 border-b border-slate-200 dark:border-slate-800 flex flex-col lg:flex-row lg:items-end lg:justify-between gap-3">
            <div>
              <div class="text-base font-semibold">Candidates</div>
              <div class="text-xs text-slate-500 dark:text-slate-400">Search and review candidate profiles.</div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2 w-full lg:w-auto">
              <div>
                <label class="block text-xs text-slate-600 dark:text-slate-300">Name</label>
                <input id="cand-filter-name" class="w-full px-3 py-2 rounded border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-950 text-sm" placeholder="e.g. Jane" />
              </div>
              <div>
                <label class="block text-xs text-slate-600 dark:text-slate-300">Email</label>
                <input id="cand-filter-email" class="w-full px-3 py-2 rounded border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-950 text-sm" placeholder="e.g. jane@…" />
              </div>
              <div class="flex gap-2 items-end">
                <button id="cand-search-btn" class="w-full px-3 py-2 rounded bg-slate-900 hover:bg-slate-800 text-white text-sm">Search</button>
                <button id="cand-create-btn" class="w-full px-3 py-2 rounded bg-emerald-600 hover:bg-emerald-700 text-white text-sm">New</button>
              </div>
            </div>
          </div>

          <div class="overflow-auto">
            <table class="min-w-full">
              <thead>
                <tr class="text-left text-xs uppercase tracking-wide text-slate-500 dark:text-slate-400">
                  <th class="px-4 py-3">Name</th>
                  <th class="px-4 py-3">Email</th>
                  <th class="px-4 py-3">Phone</th>
                  <th class="px-4 py-3">Applications</th>
                  <th class="px-4 py-3 text-right">Actions</th>
                </tr>
              </thead>
              <tbody id="cand-tbody" class="text-sm"></tbody>
            </table>
          </div>

          <div id="cand-pagination" class="px-4 py-3"></div>
        </section>
      </div>
    </main>
  </div>

  <div id="candidate-modal" class="hidden fixed inset-0 z-[85]" aria-hidden="true" data-modal>
    <div class="absolute inset-0 bg-black/40" data-modal-overlay></div>
    <div class="absolute inset-0 flex items-center justify-center p-4">
      <div class="w-full max-w-3xl rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-xl">
        <div class="px-4 py-4 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between">
          <div class="text-base font-semibold" id="candidate-modal-title">Candidate</div>
          <button class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200" type="button" data-modal-close>✕</button>
        </div>
        <div id="candidate-modal-body" class="p-4"></div>
      </div>
    </div>
  </div>

  <script src="./scripts/core.js"></script>
  <script src="./scripts/ui.js"></script>
  <script src="./scripts/api.js"></script>
  <script src="./scripts/app.js"></script>
  <script src="./scripts/candidates.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      window.HRMSRecruitment.candidates.init();
    });
  </script>
</body>

</html>
